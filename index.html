let currentQuestion = 0;
let score = 0;
let timer;
let timeLeft = 60;
let shuffledOptions = [];

function startQuiz() {
    document.getElementById('start-screen').classList.add('hide');
    document.getElementById('quiz-screen').classList.remove('hide');
    currentQuestion = 0;
    score = 0;
    loadQuestion();
}

function loadQuestion() {
    clearInterval(timer);
    timeLeft = 60;
    document.getElementById('time-left').innerText = timeLeft;
    document.getElementById('explanation-box').classList.add('hide');

    const q = quizData[currentQuestion];
    document.getElementById('question-number').innerText = `Soal ${currentQuestion + 1} / ${quizData.length}`;
    document.getElementById('score-count').innerText = `Skor: ${Math.round(score)}`;
    document.getElementById('question-text').innerText = q.q;
    
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    let optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
    optionsWithIndex.sort(() => Math.random() - 0.5);
    shuffledOptions = optionsWithIndex;

    optionsWithIndex.forEach((optObj, idx) => {
        const btn = document.createElement('button');
        btn.classList.add('option-btn');
        btn.innerText = optObj.text;
        btn.onclick = () => selectOption(idx, optObj.originalIndex);
        container.appendChild(btn);
    });

    document.getElementById('next-btn').disabled = true;

    timer = setInterval(() => {
        timeLeft--;
        document.getElementById('time-left').innerText = timeLeft;
        if (timeLeft <= 0) {
            clearInterval(timer);
            timeOut();
        }
    }, 1000);
}

function selectOption(selectedIndex, originalIndex) {
    clearInterval(timer);
    const q = quizData[currentQuestion];
    const buttons = document.querySelectorAll('.option-btn');
    
    buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (shuffledOptions[idx].originalIndex === q.answer) {
            btn.classList.add('correct');
        }
    });

    if (originalIndex === q.answer) {
        score += 2.5; // 40 soal x 2.5 = 100
        document.getElementById('score-count').innerText = `Skor: ${Math.round(score)}`;
    } else {
        buttons[selectedIndex].classList.add('wrong');
    }

    showExplanation();
}

function timeOut() {
    const q = quizData[currentQuestion];
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (shuffledOptions[idx].originalIndex === q.answer) {
            btn.classList.add('correct');
        }
    });
    showExplanation();
}

function showExplanation() {
    const q = quizData[currentQuestion];
    document.getElementById('explanation-text').innerText = q.explanation;
    document.getElementById('explanation-box').classList.remove('hide');
    document.getElementById('next-btn').disabled = false;
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < quizData.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('quiz-screen').classList.add('hide');
    document.getElementById('result-screen').classList.remove('hide');
    
    document.getElementById('final-score').innerText = Math.round(score);
    let message = score >= 80 ? "Sangat Luar Biasa! Pemahaman HOTS kamu sangat matang." : "Bagus! Terus tingkatkan pemahaman materi Hari Akhir.";
    document.getElementById('result-message').innerText = message;
}

function toggleReview() {
    const container = document.getElementById('review-container');
    container.classList.toggle('hide');
    if (!container.classList.contains('hide')) {
        container.innerHTML = '<h3>📜 Pembahasan Lengkap Semua Soal:</h3>';
        quizData.forEach((q, idx) => {
            container.innerHTML += `
                <div class="review-item">
                    <b>Soal ${idx + 1}:</b> ${q.q}<br>
                    <span style="color:#10b981; font-weight:bold;">Kunci Jawaban: ${q.options[q.answer]}</span><br>
                    <small><b>Pembahasan:</b> ${q.explanation}</small>
                </div>`;
        });
    }
}

function restartQuiz() {
    document.getElementById('result-screen').classList.add('hide');
    startQuiz();
}
